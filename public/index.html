<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Turno - Hospital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header-logo">
            <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
              <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#8FAFCC;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#5A7FA8;stop-opacity:1" />
                </linearGradient>
              </defs>
              <circle cx="100" cy="100" r="95" fill="url(#grad1)" stroke="#2E4A73" stroke-width="2"/>
              <g fill="#FFFFFF">
                <rect x="85" y="50" width="30" height="100" rx="3"/>
                <rect x="50" y="85" width="100" height="30" rx="3"/>
              </g>
              <circle cx="100" cy="100" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
            </svg>
        </div>
        <div class="welcome-message">
            <p>Bienvenido al <strong>Hospital San Ángel Inn</strong>. Estamos comprometidos con su salud y bienestar. Por favor, espere un momento mientras lo atendemos. Si tiene alguna duda, nuestro personal estará encantado de ayudarle.</p>
        </div>
        <h1>Registro de Turno</h1>
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" required>
            </div>
            <div class="form-group">
                <label for="area">Área a visitar:</label>
                <select id="area" required>
                    <option value="">Selecciona un área</option>
                    <option value="Urgencias">Urgencias</option>
                    <option value="Imagenología">Imagenología</option>
                    <option value="Endoscopía">Endoscopía</option>
                    <option value="Laboratorio">Laboratorio</option>
                    <option value="Admisión General">Admisión General</option>
                </select>
            </div>
            <button type="submit">Registrar Turno</button>
        </form>
        <div id="mensaje"></div>
    </div>
    <script src="js/registro.js"></script>
</body>
</html>

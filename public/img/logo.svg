<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8FAFCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A7FA8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" stroke="#2E4A73" stroke-width="2"/>
  
  <!-- Cruz médica (símbolo de hospital) -->
  <g fill="#FFFFFF">
    <!-- Barra vertical de la cruz -->
    <rect x="85" y="50" width="30" height="100" rx="3"/>
    <!-- Barra horizontal de la cruz -->
    <rect x="50" y="85" width="100" height="30" rx="3"/>
  </g>
  
  <!-- Círculo interior decorativo -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  
  <!-- Texto "Hospital" abajo -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E4A73" text-anchor="middle">HOSPITAL</text>
</svg>
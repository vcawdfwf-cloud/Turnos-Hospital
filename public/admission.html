<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Admisión - Hospital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Panel de Admisión</h1>
        <div class="admission-panel">
            <div class="current-turn">
                <h2>Paciente Siendo Atendido</h2>
                <div id="turnoActual"></div>
            </div>
            <div class="waiting-list">
                <h2>Turnos en Espera</h2>
                <ul id="listaEspera"></ul>
            </div>
            <div class="completed-turns">
                <h2>Turnos Atendidos Hoy</h2>
                <ul id="listaAtendidos"></ul>
            </div>
            <div class="controls">
                <div class="control-group">
                    <label for="atendidoPor">Seleccionar Módulo:</label>
                    <select id="atendidoPor">
                        <option value="Admisión 1">Admisión 1</option>
                        <option value="Admisión 2">Admisión 2</option>
                        <option value="Admisión 3">Admisión 3</option>
                        <option value="Admisión 4">Admisión 4</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="llamarSiguiente" class="btn-primary">
                        📢 Llamar Siguiente Paciente
                    </button>
                    <button id="finalizarTurno" class="btn-success" disabled>
                        ✅ Finalizar Atención
                    </button>
                    <button id="enviarWhatsapp" class="btn-secondary">
                        📩 Enviar Mensaje por WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/admission.js"></script>
</body>
</html>
